[project]
name = "tarjim"
version = "0.1.0"
description = "Arabic subtitle overlay for PS5 on a Google TV (personal tool)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11.0",
    # GPL-3.0. Used only for its vendored, patched pyremoteplay (receive-only).
    "ps5-remoteplay-mcp==0.2.2",
]

[project.scripts]
tarjim = "tarjim.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tarjim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
