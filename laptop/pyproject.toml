[project]
name = "tarjim"
version = "0.1.0"
description = "Arabic subtitle overlay for PS5 on a Google TV (personal tool)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ctranslate2>=4.9.0",
    "freetype-py>=2.5",
    "numpy>=2.0",
    "onnxruntime>=1.32.0",
    "opencv-python-headless>=4.10",
    "pillow>=11.0",
    # GPL-3.0. Used only for its vendored, patched pyremoteplay (receive-only).
    "ps5-remoteplay-mcp==0.2.2",
    "pyyaml>=6",
    "rapidocr>=3.10.0",
    "sentencepiece>=0.2.3",
    "uharfbuzz>=0.45",
]

[project.scripts]
tarjim = "tarjim.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tarjim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
